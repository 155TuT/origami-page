<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>栏目折纸 · 折间</title>
  <link rel="stylesheet" href="../../src/styles/tokens.css">
  <link rel="stylesheet" href="./selection.css">
  <link rel="stylesheet" href="./folds.css">
  <style id="desk-texture"></style>
  <script src="../../src/scripts/desk-texture.cjs"></script>
  <script src="./selection.js" defer></script>
  <script src="./fold-catalog.js" defer></script>
  <script src="./fold-poses.js" defer></script>
  <script src="./fold-shapes.js" defer></script>
  <script src="./folds.js" defer></script>
</head>
<body>
  <a class="skip" href="#fold-title">跳到栏目折纸</a>
  <header class="bar">
    <div class="bar-inner">
      <a class="wordmark" href="./index.html"><strong>折间</strong><i lang="en">Fold Journal</i></a>
      <nav aria-label="样张导航">
        <a href="./index.html#specimen">正文试排</a>
        <a href="./index.html#technical">代码与公式</a>
        <a href="./index.html#icons">功能图标</a>
        <a href="./folds.html" aria-current="page">栏目折纸</a>
      </nav>
      <button class="theme-toggle" type="button"><span aria-hidden="true"></span><span id="theme-label">深色纸面</span></button>
    </div>
  </header>
  <main class="fold-page">
    <header class="fold-heading">
      <h1 id="fold-title">栏目折纸</h1>
      <p>首页留给千纸鹤，作品集用纸剪刀。文章比较四种可撑开的纸船，影集从较高角度看川崎玫瑰的花心。</p>
    </header>
    <section aria-labelledby="dock-title" class="fold-dock-proof">
      <div class="section-heading">
        <h2 id="dock-title">并排看轮廓</h2>
        <fieldset class="segment" id="fold-sizes">
          <legend class="sr-only">停靠样张宽度</legend>
          <label><input type="radio" name="fold-size" value="22" checked>22 px</label>
          <label><input type="radio" name="fold-size" value="39">39 px</label>
        </fieldset>
      </div>
      <div class="fold-docks" role="group" aria-label="选择要比较的栏目"></div>
      <p class="fold-proof-note">点选栏目查看折边。下方选中的纸船会出现在「文章」位置。</p>
    </section>
    <section class="fold-study" aria-labelledby="fold-section-name">
      <div class="fold-study-header">
        <h2 id="fold-section-name"></h2>
        <div id="fold-options" role="group" aria-label="并排比较文章的四种纸船"></div>
      </div>
      <div id="fold-detail"></div>
    </section>
    <p class="fold-notes">纸鹤与四种船的方位角为 −30°，仰角为 30°。玫瑰沿用同一方位，将仰角抬至 60°。各款实心和线稿来自同一折姿。<a href="./fold-art/credits.md">折姿与图版来源</a></p>
    <noscript>请启用 JavaScript 查看折纸资料与停靠样张。</noscript>
  </main>
</body>
</html>
